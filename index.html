<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      background: #111;
      overflow: hidden;
      margin: 0;
      height: 100vh;
      width: 100vw; 
    }

    #root {
      width: 100%;
      height: 100%;
      position: relative;
    }

    .container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }

    .container img {
        height: 100vh;            /* Fill the screen height */
        width: auto;              /* Maintain aspect ratio */
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%); /* Center horizontally */
        object-fit: contain;      /* Ensure full image is visible */
        opacity: 0;
        transition: opacity 10s ease-in-out;
        z-index: 1;
    }

    .container img.visible {
      opacity: 1;
      z-index: 2;
    }

    .blur-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      backdrop-filter: blur(15px);
      z-index: 10;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="container"></div>
    <div class="blur-overlay"></div>
  </div>

  <script>
    const container = document.querySelector(".container");
    let photoArray = [];
    let pageIndex = 8;
    let interval = null;

    const apiKey = "651be518ac3489786fe4403ad686b892";
    const perPage = 50;

    const getPhotos = () => {
      const tags = encodeURIComponent("passport photo, ID photo, mugshot");
      const url = `https://www.flickr.com/services/rest/?method=flickr.photos.search&api_key=${apiKey}&tags=${tags}&per_page=${perPage}&sort=relevance&format=json&nojsoncallback=1&safe_search=1`;

      fetch(url)
        .then(response => response.json())
        .then(data => {
          let loadedCount = 0;
          const totalPhotos = data.photos.photo.length;

          data.photos.photo.forEach(photo => {
            const img = new Image();
            img.crossOrigin = "anonymous";
            img.src = `https://farm${photo.farm}.staticflickr.com/${photo.server}/${photo.id}_${photo.secret}.jpg`;

            img.onload = () => {
              loadedCount++;
              if (img.naturalHeight >= img.naturalWidth) {
                photoArray.push(img);
              }
              if (loadedCount === totalPhotos) {
                startSlideshow();
              }
            };

            img.onerror = () => {
              loadedCount++;
              if (loadedCount === totalPhotos) {
                startSlideshow();
              }
            };
          });
        })
        .catch(err => console.warn('Error fetching photos:', err));
    };

    const startSlideshow = () => {
      if (photoArray.length === 0) return;

      const firstImage = photoArray[pageIndex];
      firstImage.classList.add('visible');
      container.appendChild(firstImage);

      pageIndex = (pageIndex + 1) % photoArray.length;

      interval = setInterval(() => {
        const currentImage = container.querySelector("img.visible");

        const nextImage = photoArray[pageIndex];
        container.appendChild(nextImage);
        nextImage.offsetHeight; // Force reflow
        nextImage.classList.add('visible');

        setTimeout(() => {
          if (currentImage) container.removeChild(currentImage);
        }, 10000);

        pageIndex = (pageIndex + 1) % photoArray.length;
      }, 10000);
    };

    getPhotos();
  </script>
</body>
</html>
